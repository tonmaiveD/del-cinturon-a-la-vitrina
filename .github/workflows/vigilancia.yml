name: Vigilancia de la web publicada
# Cada día, doce horas después de la consulta del bot: falla (y GitHub avisa por correo) si la
# web no responde, si los datos no son JSON válido o si la última consulta al CNEOS tiene más
# de 48 h (M17, M16). No necesita dependencias.
on:
  schedule:
    - cron: '30 19 * * *' # todos los días, 19:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vigilar:
    # Imagen fijada, como en ci.yml
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node pipeline/vigilancia.ts
