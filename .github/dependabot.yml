# Actualizaciones propuestas como pull requests: la CI las prueba (incluidas las validaciones
# científicas) y se integran a mano, nunca solas. Las versiones recién publicadas esperan dos
# semanas antes de proponerse.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint admite TypeScript < 6.1 (peerDependencies de la 8.71): proponer una
      # versión mayor rompe la resolución (error de Dependabot del 2026-10-11). Quitar esta
      # regla cuando typescript-eslint amplíe su rango.
      - dependency-name: typescript
        versions: ['>= 6.1.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
